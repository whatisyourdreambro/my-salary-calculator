# Local mobile lab checks. Advertising/analytics requests are blocked in this
# measurement only; these reports do not represent live ad load or field CWV.

name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # 수동 실행도 가능

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npx --yes --package=@lhci/cli@0.15.1 lhci autorun --config=lighthouserc.cjs

      - name: Save mobile lab reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-lab
          path: |
            lhci-report/
            .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
