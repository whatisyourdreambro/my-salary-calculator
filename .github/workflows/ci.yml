# CI 게이트 — 테스트·정합성 검증·qa-crawl (2026-08 수익화·정합성 작업에서 신설)
# 기존 CI 는 lighthouse.yml(성능)뿐이라 verify:*·test 가 어디서도 강제되지 않았다.
name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # 주간 프로덕션 헬스체크 (2026-09-05) — scripts/health-check.mjs 를 사람이 돌려야만 했던 공백 해소.
  # 배경: 2026-08 /salary 전량 500 을 수개월 미발견. 실패 시 GitHub 워크플로 실패 알림 메일로 통지.
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST (00:00 UTC)
  workflow_dispatch:

jobs:
  health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: 프로덕션 헬스체크 (실패 시 5분 후 1회 재시도 — 배포 전파 중 오탐 방지)
        run: |
          if node scripts/health-check.mjs; then exit 0; fi
          echo "첫 실행 실패 — 300초 후 재시도"
          sleep 300
          node scripts/health-check.mjs

  verify:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # 광고 위 UI 게이트(ad-audit --diff)가 push 이전 커밋·PR base 커밋과 비교하려면 전체 이력이 필요.
          # 기본값 1(얕은 clone)이면 git diff 가 실패하고, 스크립트는 CI 에서 그 경우 exit 2 로 멈춘다.
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:framework-security
      - name: Verify QA network safety
        run: npm run qa:safety
      - run: npm test
      # 스크립트 테스트 전량 (2026-09-28 감사 S31) — 종전에는 10개를 손으로 나열해 indexnow-diff·indexnow-naver·
      # crawl-cache-sampler·pay-official-parse 4개가 CI 에서 한 번도 돌지 않았다. 새 *.test.mjs 는 자동 편승.
      - run: node --test scripts/__tests__/*.test.mjs
      - run: npm run qa:share
      - run: python3 scripts/verify-contact-storage.py
      - run: python3 scripts/verify-fixed-feedback-storage.py
      - run: python3 scripts/verify-participation-storage.py
      - run: npm run verify:tax
      - run: npm run verify:site
      - run: npm run verify:companies
      - run: npm run verify:sitemap
      - run: npm run verify:bonus
      - run: npm run ad-audit
      # 광고 위 새 UI 삽입 게이트 (2026-09-25, 감사 ADS-03 — 2026-08-16 수익 급락 사건 규칙).
      # 기준 커밋: push 는 github.event.before(이번 push 직전 main), PR 은 pull_request.base.sha.
      # 운영자는 main 에 직접 push 하므로 merge-base(origin/main, HEAD) 방식은 HEAD 가 되어 diff 가 빈다 — 쓰지 않는다.
      # before 가 0000…(첫 push)이거나 clone 에 없는 커밋(force push 로 사라진 이력)이면 HEAD~1 로 대체.
      # The approved local publisher requires this exact commit to pass verify.
      - name: 광고 위 새 UI 게이트 (ad-audit --diff)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE="$PR_BASE"; else BASE="$PUSH_BEFORE"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::notice::diff 기준 커밋(${BASE:-없음})을 쓸 수 없어 HEAD~1 로 대체합니다"
            BASE="HEAD~1"
          fi
          echo "ad-audit --diff 기준: $BASE"
          node scripts/ad-audit.mjs --diff --base "$BASE"
      - run: npm run lint
      # Native static Pages build; isolated ad-free artifacts are never deployed.
      - run: npm run qa:pages:build
      - run: npm run qa:pages:verify
      # 자동광고 배치 경로 회귀 게이트 (2026-09-25, 수익 추천 #4) — 9/10 루트 래퍼 h-full 삭제(4eda6889)로
      # AdSense 자동 인페이지 노출/PV 가 약 75% 줄어든 채 2주가 간 사건의 재발 방지. 대표 11쪽 프리렌더 HTML 의
      # CSS 경로를 scripts/autoads-paths.baseline.json 과 대조해 루트 셸이 깨지거나 한 쪽이라도 20% 넘게 사라지면 실패.
      # 의도한 개편이면 스크립트 머리말의 --update 절차(기준선 갱신 = 자동광고 학습 위치를 버리는 결정).
      - run: node scripts/verify-autoads-paths.mjs --next-dir .pages-qa/.next
      - run: npm run qa:quality -- --next-dir .pages-qa/.next
      - name: 전체 URL 품질 장부 업로드
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: page-quality-ledger
          path: .artifacts/page-quality/
          if-no-files-found: ignore
      - name: 공유 경로 소스 장부 업로드
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: share-source-ledger
          path: .artifacts/share-coverage/
          if-no-files-found: ignore
      - name: 광고 비활성 로컬 Pages 정합성 및 화면 전환
        env:
          BASE_URL: http://127.0.0.1:3000
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          setsid npm run qa:pages:start -- --port 3000 &
          SERVER_PID=$!
          trap 'kill -- "-$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -sf --max-time 5 -A "MoneySalary-QA/1.0" "$BASE_URL/" > /dev/null; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "::error::The ad-free local Pages runtime did not become ready"
            exit 1
          fi
          npm run qa:crawl
          npm run qa:english
          npm run qa:pages:http
          npm run qa:run -- scripts/qa-pages-navigation.mjs
          QA_ROUTES="/calc/samsung-bonus,/,/car-loan,/salary-db/lig-nex1" npm run qa:run -- scripts/qa-calculator-experience.mjs
          QA_RECEIPT_MODE=legacy QA_RUN_LABEL=receipt-legacy npm run qa:run -- scripts/qa-calculator-experience.mjs
          QA_SHARE_PRIVACY_MODE=1 QA_RUN_LABEL=share-privacy npm run qa:run -- scripts/qa-calculator-experience.mjs
          npm run qa:run -- scripts/__tests__/qa-saved-recalculation.mjs
          QA_CONTRAST_ONLY=1 QA_ROUTES="/table/2026/monthly,/table/2027/monthly,/job/safety-engineer,/job/software-engineer" npm run qa:run -- scripts/qa-calculator-experience.mjs
          QA_FOCUS_FORCED_COLORS=1 npm run qa:run -- scripts/qa-focus-input.mjs
          npm run qa:run -- scripts/qa-interaction-states.mjs
      - name: 로컬 화면 및 대비 검증 근거
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: experience-qa
          path: .artifacts/experience-qa/
          if-no-files-found: ignore
      - name: Keyboard focus and input guidance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: focus-input-qa
          path: .artifacts/focus-input-qa/
          if-no-files-found: ignore
      - name: Calculation, error, modal and radio interaction evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: interaction-states-qa
          path: .artifacts/interaction-states-qa/
          if-no-files-found: ignore
      - name: English page quality ledger
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: english-page-quality
          path: .artifacts/english-page-quality/
          if-no-files-found: ignore
      - name: qa-report 업로드
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qa-report
          path: qa-report.md
          if-no-files-found: ignore
