# Manual cache invalidation after a separately controlled deployment.
# Pages is the current publication target; Workers remains a dormant legacy path.
# No source push triggers this workflow and this workflow never publishes a Worker.
# Pages uses the exact publication commit; Workers still requires tag + version UUID.
# Workers missing credentials fail closed; Pages missing credentials retain a notice/skip.
# Capture IndexNow delta before activation and submit it separately after activation/Purge.
# Setup: docs/trend-publishing-runbook.md §7 and docs/operator-console-pack.md.
name: cf-purge
run-name: Cloudflare ${{ inputs.operation || 'purge' }} ${{ inputs.request_id || inputs.release_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Purge after release, or read cache configuration without changes
        required: true
        type: choice
        options: [purge, audit-only, pages-verified-purge]
        default: purge
      target:
        description: Deployment target (current publication target is Pages)
        required: true
        type: choice
        options: [pages, workers]
        default: pages
      worker_name:
        description: Worker name (defaults to repository variable)
        type: string
      release_tag:
        description: Exact activated Workers version tag (required for Workers; no fallback)
        type: string
      expected_version_id:
        description: Full activated Worker version UUID (required for Workers)
        type: string
      release_sha:
        description: Pages publication commit SHA (defaults to selected commit)
        type: string
      expected_deployment_id:
        description: Exact canonical Pages deployment UUID for verified purge
        type: string
      expected_configuration_hash:
        description: Exact Pages configuration SHA-256 for verified purge
        type: string
      request_id:
        description: Unique approved local publisher request UUID
        type: string

permissions:
  contents: read

# 같은 커밋 수동 재실행이 겹치지 않게 묶는다.
concurrency:
  group: cf-purge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  pages-verified-purge:
    if: inputs.operation == 'pages-verified-purge'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Purge only the pinned canonical Pages deployment
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_PAGES_COMMIT_SHA: ${{ inputs.release_sha }}
          CF_EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          CF_EXPECTED_CONFIGURATION_HASH: ${{ inputs.expected_configuration_hash }}
          CF_PURGE_REQUEST_ID: ${{ inputs.request_id }}
        run: node scripts/pages-verified-purge.mjs
      - name: Verified purge receipt
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pages-verified-purge-${{ inputs.request_id }}
          path: .artifacts/pages-purge/purge-receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  purge:
    if: inputs.operation == 'purge' || inputs.operation == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      CF_DEPLOY_TARGET: ${{ inputs.target || 'pages' }}
      CF_WORKER_NAME: ${{ inputs.worker_name || vars.CF_WORKER_NAME }}
      CF_RELEASE_TAG: ${{ inputs.release_tag }}
      CF_EXPECTED_VERSION_ID: ${{ inputs.expected_version_id }}
      CF_PAGES_COMMIT_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - name: 수동 릴리스 식별자 확인
        run: |
          node --input-type=module <<'NODE'
          const env = process.env;
          if (!['workers', 'pages'].includes(env.CF_DEPLOY_TARGET)) {
            throw new Error('Select pages or the legacy workers target; no purge.');
          }
          if (env.CF_DEPLOY_TARGET === 'workers') {
            if (!/^[a-z0-9._-]{1,128}$/i.test(env.CF_RELEASE_TAG ?? '')) {
              throw new Error('Workers purge requires the exact release_tag; no SHA fallback.');
            }
            if (!/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(env.CF_EXPECTED_VERSION_ID ?? '')) {
              throw new Error('Workers purge requires expected_version_id as a full activated version UUID.');
            }
          }
          NODE
      - name: 시크릿 확인
        id: secrets
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_ZONE_ID" ]; then
            if [ "$CF_DEPLOY_TARGET" = "workers" ]; then
              echo "::error::Workers verification credentials missing; no purge."
              exit 1
            fi
            echo "::notice::CF_API_TOKEN / CF_ACCOUNT_ID / CF_ZONE_ID 시크릿이 모두 있어야 캐시 자동 Purge 가 동작합니다 — 이번에는 건너뜀(설정: docs/operator-console-pack.md). 그동안은 배포마다 수동 Purge."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v7.1.0
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          package-manager-cache: false
      - name: 활성 릴리스 확인 후 Purge Everything
        if: steps.secrets.outputs.ok == 'true'
        env:
          CF_PAGES_PROJECT: my-salary-calculator
          CF_PURGE_TIMEOUT_MINUTES: "25"
        run: node scripts/cf-purge-after-deploy.mjs

  cache-audit:
    if: inputs.operation == 'audit-only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - name: Read cache configuration (no purge, deploy, or publisher requests)
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const zone = process.env.CF_ZONE_ID, token = process.env.CF_API_TOKEN;
          assert.match(zone || '', /^[a-f0-9]{32}$/);
          assert.ok(token && !/\s/.test(token));
          const get = async resource => {
            let response;
            try { response = await fetch('https://api.cloudflare.com/client/v4/zones/' + zone + resource, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(20000),
              headers: { Authorization: 'Bearer ' + token, 'User-Agent': 'MoneySalary-cache-audit/1.0' },
            }); } catch { return { ok: false, status: 0, transportFailed: true }; }
            let data;
            try { data = await response.json(); }
            catch { return { ok: false, status: response.status, invalidJson: true }; }
            if (!response.ok || data.success !== true) return { ok: false, status: response.status, codes: (data.errors || []).map(x => x.code) };
            return { ok: true, result: data.result };
          };
          const identity = await get('');
          assert.equal(identity.ok, true, 'Cannot verify zone; no further requests.');
          assert.equal(identity.result.name, 'moneysalary.com');
          const publicLiterals = new Set(['', '/', '/*', '/api/', '/api/*', '/share/', '/share/*', '/_next/', '/_next/*',
            '/_msy/', '/_msy/*', '/en/', '/en/*', 'moneysalary.com', 'www.moneysalary.com', 'GET', 'HEAD', 'POST']);
          const expression = value => String(value || '').length > 8000 ? '<redacted:oversize>'
            : String(value || '').replace(/"((?:\\.|[^"\\])*)"/g, (_, literal) => JSON.stringify(publicLiterals.has(literal) ? literal : '<redacted>'));
          const target = value => /^(?:\*|https?:\/\/)?(?:\*\.|www\.)?moneysalary\.com(?:\/\*)?$/.test(value || '') ? value : '<redacted>';
          const cacheHeader = value => ({ operation: ['set', 'remove', 'append'].includes(value.operation) ? value.operation : '<redacted>',
            ...(typeof value.value === 'string' && value.value.length <= 256 && value.value.split(',').every(part =>
              /^(?:public|private|no-store|no-cache|immutable|must-revalidate|proxy-revalidate|(?:s-maxage|max-age|stale-while-revalidate|stale-if-error)=\d+)$/i.test(part.trim()))
              ? { value: value.value } : { value: '<redacted>' }) });
          const allowedParameters = new Set(['cache', 'edge_ttl', 'browser_ttl', 'origin_cache_control', 'respect_strong_etags']);
          const allowedActions = new Set(['cache_level', 'edge_cache_ttl', 'browser_cache_ttl', 'cache_by_device_type', 'origin_cache_control']);
          const report = { checkedAt: new Date().toISOString(), mode: 'audit-only', mutations: 0, publisherRequests: 0, records: [] };
          for (const resource of ['/rulesets/phases/http_request_cache_settings/entrypoint', '/pagerules?status=active', '/rulesets/phases/http_response_headers_transform/entrypoint']) {
            const response = await get(resource);
            if (!response.ok) { report.records.push({ resource, ...response }); continue; }
            const rules = Array.isArray(response.result) ? response.result : response.result.rules || [];
            report.records.push({ resource, ok: true, rules: rules.map(rule => ({
              id: rule.id, enabled: rule.enabled ?? rule.status === 'active', action: rule.action,
              expression: expression(rule.expression),
              targets: rule.targets?.map(item => ({ target: item.target, operator: item.constraint?.operator,
                value: target(item.constraint?.value) })),
              parameters: Object.fromEntries(Object.entries(rule.action_parameters || {}).filter(([key]) => allowedParameters.has(key))),
              responseCacheHeaders: Object.fromEntries(Object.entries(rule.action_parameters?.headers || {})
                .filter(([key]) => /^(?:cache-control|cdn-cache-control|cloudflare-cdn-cache-control)$/i.test(key)).map(([key, value]) => [key, cacheHeader(value)])),
              actions: rule.actions?.filter(item => allowedActions.has(item.id)),
            })) });
          }
          report.complete = report.records.every(item => item.ok || item.status === 404);
          console.log('CACHE_AUDIT_RESULT ' + JSON.stringify(report));
          if (!report.complete) process.exitCode = 1;
          NODE
